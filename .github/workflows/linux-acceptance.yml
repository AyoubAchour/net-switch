name: Acceptance

# The 1.0 profile runs the real Linux engine in isolated namespaces. Every
# ordinary assertion remains mandatory. Explicitly declared load-attribution
# requirements are reported as release blockers until the eBPF follow-up lands.
on:
  push:
    branches: [main]
  # The ci:full label is read on the PR's next push. Label changes don't start
  # a run: they would share the PR's concurrency group and cancel its run.
  pull_request:
  workflow_dispatch:
    inputs:
      release_gate:
        description: 'Check Linux 1.0 release blockers and pending gates only (no engine workload)'
        type: boolean
        required: false
        default: false
      profile:
        description: 'Record CPU profiles and a bounded scheduling trace for selected cases'
        type: boolean
        required: false
        default: false
      run:
        description: 'Only cases whose id matches this regular expression (empty: all)'
        required: false
        default: ''
      engine_build:
        description: 'Both ordinary release cases and tagged fault cases, or a focused build'
        type: choice
        options: [all, release, faults]
        default: all
      runner:
        description: 'A single runner for focused diagnostics; PR checks always use all four'
        type: choice
        options: [all, ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm, ubuntu-26.04-arm]
        default: all
      trace_artifact:
        description: 'Analyse an existing trace artifact only (no new engine workload)'
        required: false
        default: ''
      shared_tests:
        description: 'Also run shared relay, UDP and Linux lookup race regressions'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # A new commit replaces the same PR's older run. Every main run keeps its own
  # group, so each main commit is tested in full.
  group: ${{ github.event_name == 'pull_request' && format('linux-acceptance-pr-{0}', github.event.pull_request.number) || format('linux-acceptance-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Picks the jobs a pull request needs from its changed files
  # (.github/ci/changes.mjs); pushes, manual runs, stacked PRs and the ci:full
  # label get every group. A gated job runs unless this job succeeded and
  # answered false for its group, so a failure here costs runner time, never
  # coverage. .github/ci/gates.test.mjs checks every gate below.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Every group, so this job is the same in each workflow that has one.
    outputs:
      node: ${{ steps.filter.outputs.node }}
      helper: ${{ steps.filter.outputs.helper }}
      installer: ${{ steps.filter.outputs.installer }}
      legacy_windows: ${{ steps.filter.outputs.legacy_windows }}
      testisp: ${{ steps.filter.outputs.testisp }}
      wintun: ${{ steps.filter.outputs.wintun }}
      go_windows: ${{ steps.filter.outputs.go_windows }}
      go_linux: ${{ steps.filter.outputs.go_linux }}
      acceptance: ${{ steps.filter.outputs.acceptance }}
      control: ${{ steps.filter.outputs.control }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base and its file list need the whole history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test the classifier, its map against test readers, and the job gates
        run: node --test .github/ci/*.test.mjs
      - name: Choose jobs from the changed files
        id: filter
        run: node .github/ci/changes.mjs

  # The two manual-only jobs below start from a workflow_dispatch input and
  # never on a push or pull request, so they have no changed-files gate.
  release-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate }}
    name: Linux 1.0 release gate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: -mod=vendor -p=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test release classification and mandatory failures
        run: go test -count=1 -v ./tests/linux/harness ./tests/linux/suite
      - name: Refuse a release while any declared gate is unfinished
        run: go run ./tests/linux/cmd/nsaccept release-gate
  trace-analysis:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.release_gate && inputs.trace_artifact != '' }}
    name: Analyse saved runtime trace
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Summarize saved scheduler and syscall timing in memory
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ inputs.trace_artifact }}
        run: |
          [[ "$ARTIFACT" =~ ^[0-9]+$ ]]
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT/zip" | node scripts/ci-trace-summary.mjs
  linux:
    needs: changes
    if: ${{ !cancelled() && !inputs.release_gate && !inputs.trace_artifact && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.acceptance != 'false') }}
    name: Linux acceptance / ${{ matrix.runner }}
    # Pinned labels: ubuntu-latest moves between releases.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runner: ${{ fromJSON(inputs.runner && inputs.runner != 'all' && format('["{0}"]', inputs.runner) || '["ubuntu-24.04","ubuntu-26.04","ubuntu-24.04-arm","ubuntu-26.04-arm"]') }}
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - name: Record the job's start for failure evidence
        run: echo "NSACCEPT_JOB_START=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # squashfs-tools: `snap pack` builds the test snap with it.
      - name: Install test tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends jq nftables iproute2 flatpak fuse3 squashfs-tools
      - name: Read the pinned snap revisions
        id: snaps
        run: |
          arch=$(dpkg --print-architecture)
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          for name in core24 snapd; do
            echo "$name=$(jq -er --arg arch "$arch" --arg name "$name" '.[$arch][$name].revision' tests/linux/suite/snap-inputs.json)" >> "$GITHUB_OUTPUT"
          done
      - name: Cache the pinned snaps and assertions
        id: snap-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/snap-inputs
          key: snap-inputs-v1-${{ steps.snaps.outputs.arch }}-core24-${{ steps.snaps.outputs.core24 }}-snapd-${{ steps.snaps.outputs.snapd }}
      - name: Download missing snap inputs and verify their SHA-256
        env:
          CACHE_HIT: ${{ steps.snap-cache.outputs.cache-hit }}
        run: |
          echo "snap inputs cache hit: ${CACHE_HIT:-false}"
          mode=verify
          if [[ "$CACHE_HIT" != true ]]; then mode=fetch; fi
          bash tests/linux/snap-inputs.sh "$mode" "$RUNNER_TEMP/snap-inputs"
      - name: Read the pinned Node version
        id: pins
        run: |
          echo "node_version=$(jq -r .node.version packaging/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The baseline is configured by the app's own generator (lib/engine.mjs).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pins.outputs.node_version }}
          package-manager-cache: false
      - name: Build the harness
        id: harness
        env:
          GOFLAGS: -mod=vendor
        run: |
          go test -count=1 -v ./tests/linux/harness ./tests/linux/suite
          go test -count=1 -v ./internal/journal
          go build -trimpath -o "$RUNNER_TEMP/nsaccept" ./tests/linux/cmd/nsaccept
          go build -trimpath -o "$RUNNER_TEMP/netswitch-engine" ./cmd/netswitch-engine
          go build -trimpath -tags acceptance -o "$RUNNER_TEMP/netswitch-engine-faults" ./cmd/netswitch-engine
          node scripts/engine-notices.mjs "$RUNNER_TEMP/netswitch-engine" --check
          go test -c -o "$RUNNER_TEMP/linux-platform.test" ./internal/engine/linux
      - name: Test Linux kernel interfaces and crash recovery in a private namespace
        env:
          COLD_REPEATS: ${{ github.event_name == 'workflow_dispatch' && inputs.shared_tests && '100' || '20' }}
        run: |
          sudo unshare --net -- env NETSWITCH_ISOLATED_NETNS=1 "$RUNNER_TEMP/linux-platform.test" -test.v
          sudo unshare --net -- "$RUNNER_TEMP/linux-platform.test" -test.run '^TestConcurrentColdHoldersShareDescriptorScans$' -test.count "$COLD_REPEATS" -test.v
      - name: Check shared TCP setup and lookup races
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.shared_tests && !cancelled() && steps.harness.outcome == 'success' }}
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '4'
          GOFLAGS: -mod=vendor -p=2
        run: |
          go test -race -v -count=1 ./internal/engine/tcp ./internal/engine/linux ./internal/journal
          go test -race -v -count=100 -run '^TestConcurrentColdHoldersShareDescriptorScans$' ./internal/engine/linux
      - name: Check repeated Wait and close admission at capacity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.shared_tests && !cancelled() && steps.harness.outcome == 'success' }}
        env:
          NETSWITCH_TIMEWAIT_GATE: '1'
          GOMAXPROCS: '4'
          GOFLAGS: -mod=vendor -p=2
        run: go test -v -count=1 -run '^TestCloseAtCapUnderLoad$' ./internal/engine/stack
      - name: Check shared UDP quotations and packet races
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.shared_tests && !cancelled() && steps.harness.outcome == 'success' }}
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '4'
          GOFLAGS: -mod=vendor -p=2
        run: go test -race -v -count=1 ./internal/engine/udp ./internal/engine/packet
      # The QUIC fixture is its own module at a pinned quic-go, so QUIC never
      # enters Net Switch's go.mod or vendor/.
      - name: Check and build the QUIC fixture
        id: quic
        # Collect independent acceptance evidence even if a kernel regression
        # failed. The failed kernel step still makes this job fail.
        if: ${{ !cancelled() && steps.harness.outcome == 'success' }}
        working-directory: tests/quicfixture
        env:
          GOFLAGS: -mod=readonly
        run: |
          go mod verify
          go vet ./...
          go test -count=1 -v ./...
          go build -trimpath -o "$RUNNER_TEMP/nsquic" .
      # In a transient scope with Delegate=yes: systemd lets a program create
      # cgroups only in a subtree delegated to it, and the lookup cases need some.
      - name: Run ordinary acceptance against the release binary
        if: ${{ !cancelled() && inputs.engine_build != 'faults' && steps.harness.outcome == 'success' && steps.quic.outcome == 'success' }}
        env:
          RUN_FILTER: ${{ inputs.run }}
          PROFILE: ${{ inputs.profile }}
        run: >-
          sudo systemd-run --scope --quiet -p Delegate=yes --unit "nsaccept-${{ github.run_id }}-${{ strategy.job-index }}" --
          env "PATH=$PATH" "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY"
          "NSACCEPT_SNAP_CACHE=$RUNNER_TEMP/snap-inputs"
          "NSACCEPT_PROFILE=$PROFILE"
          "$RUNNER_TEMP/nsaccept" run --engine netswitch-engine --engine-path "$RUNNER_TEMP/netswitch-engine"
          --build-mode release
          --node "$(command -v node)" --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/acceptance/release"
          --quic "$RUNNER_TEMP/nsquic"
          --app-uid "$(id -u)" --app-gid "$(id -g)" --run "$RUN_FILTER"
      - name: Run fault-injection acceptance against the tagged binary
        if: ${{ !cancelled() && inputs.engine_build != 'release' && steps.harness.outcome == 'success' && steps.quic.outcome == 'success' }}
        env:
          RUN_FILTER: ${{ inputs.run }}
          PROFILE: ${{ inputs.profile }}
        run: >-
          sudo systemd-run --scope --quiet -p Delegate=yes --unit "nsaccept-faults-${{ github.run_id }}-${{ strategy.job-index }}" --
          env "PATH=$PATH" "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY"
          "NSACCEPT_SNAP_CACHE=$RUNNER_TEMP/snap-inputs"
          "NSACCEPT_PROFILE=$PROFILE"
          "$RUNNER_TEMP/nsaccept" run --engine netswitch-engine --engine-path "$RUNNER_TEMP/netswitch-engine-faults"
          --build-mode faults
          --node "$(command -v node)" --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/acceptance/faults"
          --quic "$RUNNER_TEMP/nsquic"
          --app-uid "$(id -u)" --app-gid "$(id -g)" --run "$RUN_FILTER"
      - name: Summarize capacity heap and goroutine profiles
        if: ${{ always() }}
        run: |
          if test -d "$RUNNER_TEMP/acceptance"; then
            find "$RUNNER_TEMP/acceptance" -name 'heap.pprof' -print -exec sudo "$(command -v go)" tool pprof -top -nodecount=30 "$RUNNER_TEMP/netswitch-engine" {} \;
            find "$RUNNER_TEMP/acceptance" -name 'goroutine.pprof' -print -exec sudo "$(command -v go)" tool pprof -top -nodecount=20 "$RUNNER_TEMP/netswitch-engine" {} \;
          fi
      - name: Summarize the requested CPU profiles
        if: ${{ always() && inputs.profile }}
        run: |
          if test -d "$RUNNER_TEMP/acceptance"; then
            find "$RUNNER_TEMP/acceptance" -name 'cpu.pprof' -print -exec sudo "$(command -v go)" tool pprof -top -cum -nodecount=35 "$RUNNER_TEMP/netswitch-engine" {} \;
            find "$RUNNER_TEMP/acceptance" \( -name 'block*.pprof' -o -name 'mutex*.pprof' \) -print -exec sudo "$(command -v go)" tool pprof -top -cum -nodefraction=0 -focus='Owners' -nodecount=20 "$RUNNER_TEMP/netswitch-engine" {} \;
            find "$RUNNER_TEMP/acceptance" -name 'runtime*.trace' -print0 | while IFS= read -r -d '' trace; do
              echo "trace window: $trace"
              for kind in sched syscall; do
                sudo env "PATH=$PATH" go tool trace -pprof="$kind" "$trace" | node scripts/profile-summary.mjs "$kind"
              done
            done
          fi
      # Read-only. An unexplained kill (exit 137) then explains itself: the
      # kernel log since the job began, and the OOM counters and memory peaks
      # of this step's cgroup, its parents and any acceptance scope still left.
      - name: Capture kernel and cgroup memory evidence after a failure
        if: ${{ failure() }}
        run: |
          set +e
          echo "::group::Kernel log since $NSACCEPT_JOB_START"
          sudo journalctl -k --since "$NSACCEPT_JOB_START" --no-pager 2>&1 | tail -n 300
          echo "::endgroup::"
          echo "::group::dmesg tail"
          sudo dmesg -T 2>&1 | tail -n 100
          echo "::endgroup::"
          echo "::group::cgroup memory.events, memory.peak and OOM kills"
          own=$(sed -n 's/^0:://p' /proc/self/cgroup)
          dirs=""
          d="$own"
          while [ -n "$d" ] && [ "$d" != "/" ]; do dirs="$dirs /sys/fs/cgroup$d"; d=$(dirname "$d"); done
          for c in $dirs /sys/fs/cgroup/system.slice/nsaccept-*.scope /sys/fs/cgroup; do
            [ -d "$c" ] || continue
            echo "== $c"
            for f in memory.events memory.peak memory.max memory.current; do
              if [ -r "$c/$f" ]; then echo "$f: $(tr '\n' ' ' < "$c/$f")"; fi
            done
          done
          grep '^oom_kill' /proc/vmstat
          free -m
          echo "::endgroup::"
      - name: Make root-produced evidence readable by the artifact uploader
        if: ${{ always() }}
        run: |
          if test -d "$RUNNER_TEMP/acceptance"; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/acceptance"
          fi
      - name: Upload the report and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-acceptance-${{ matrix.runner }}
          path: ${{ runner.temp }}/acceptance
          retention-days: 14
          if-no-files-found: error

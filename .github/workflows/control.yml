name: Go control service

on:
  push:
    branches: [main, port/control-service]
  # Label changes run it again, so adding or removing ci:full takes effect.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

# Label updates and new commits replace only the same PR's older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('control-pr-{0}', github.event.pull_request.number) || format('control-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Picks the jobs a pull request needs from its changed files
  # (.github/ci/changes.mjs); pushes, manual runs and the ci:full label get
  # every group. A gated job runs unless this job succeeded and answered false
  # for its group, so a failure here costs runner time, never coverage.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Every group, so this job is the same in each workflow that has one.
    outputs:
      node: ${{ steps.filter.outputs.node }}
      helper: ${{ steps.filter.outputs.helper }}
      installer: ${{ steps.filter.outputs.installer }}
      legacy_windows: ${{ steps.filter.outputs.legacy_windows }}
      testisp: ${{ steps.filter.outputs.testisp }}
      wintun: ${{ steps.filter.outputs.wintun }}
      go_windows: ${{ steps.filter.outputs.go_windows }}
      go_linux: ${{ steps.filter.outputs.go_linux }}
      acceptance: ${{ steps.filter.outputs.acceptance }}
      control: ${{ steps.filter.outputs.control }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base and its file list need the whole history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test the changed-file classifier
        run: node --test .github/ci/changes.test.mjs
      - name: Choose jobs from the changed files
        id: filter
        run: node .github/ci/changes.mjs

  windows:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.control != 'false') }}
    name: Control / Windows ${{ matrix.arch }} / ${{ matrix.control }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
        control: [node, go]
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -mod=vendor -p=2
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Build Go control with commit identity
        run: go build -ldflags "-H windowsgui -X github.com/AyoubAchour/net-switch/internal/buildinfo.Version=${{ github.sha }}" -o bin/netswitch.exe ./cmd/netswitch
      - name: Native Win32 parity
        id: parity
        if: matrix.control == 'go'
        continue-on-error: true
        run: node scripts/win32-parity.mjs ./bin/netswitch.exe
      - name: Fetch verified sing-box
        run: ./scripts/fetch-engine.ps1
      - name: Build the two-path TUN harness and fetch its signed driver
        run: |
          go build -o dist/windows-test/testisp.exe ./tests/windows/testisp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o dist/windows-test/testisp-probe.exe ./tests/windows/testisp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/windows/testisp/fetch-wintun.ps1 -Directory dist/windows-test
      - name: Routing against the selected control executable
        run: |
          $server = if ('${{ matrix.control }}' -eq 'go') { (Resolve-Path bin/netswitch.exe).Path } else { (Get-Command node).Source }
          node scripts/e2e-routing.mjs --server-executable $server --public-via-tun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: TUN against the selected control executable
        run: |
          if ('${{ matrix.control }}' -eq 'go') {
            go build -tags control_test_https -ldflags "-H windowsgui -X github.com/AyoubAchour/net-switch/internal/buildinfo.Version=${{ github.sha }}-https-fixture" -o bin/netswitch-tun.exe ./cmd/netswitch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $server = if ('${{ matrix.control }}' -eq 'go') { (Resolve-Path bin/netswitch-tun.exe).Path } else { (Get-Command node).Source }
          node scripts/e2e-tun.mjs --server-executable $server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require native parity to pass
        if: always() && steps.parity.outcome == 'failure'
        run: throw 'Native parity failed; its complete case results are above.'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: control-${{ matrix.arch }}-${{ matrix.control }}
          path: dist/tun-test/
          retention-days: 7

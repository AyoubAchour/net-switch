name: Native service contracts

on:
  pull_request:
    paths: ['internal/**', 'cmd/**', 'tests/lifecycle/**', 'tests/linux/**', 'tests/windows/**', 'scripts/build-common.ps1', 'scripts/run-native-proof.mjs', 'packaging/versions.json', 'go.mod', 'go.sum', 'vendor/**', '.github/workflows/native-service-contracts.yml', '.github/ci/registrar-breakaway.mjs']
  push:
    branches: [main]
    paths: ['internal/**', 'cmd/**', 'tests/lifecycle/**', 'tests/linux/**', 'tests/windows/**', 'scripts/build-common.ps1', 'scripts/run-native-proof.mjs', 'packaging/versions.json', 'go.mod', 'go.sum', 'vendor/**', '.github/workflows/native-service-contracts.yml', '.github/ci/registrar-breakaway.mjs']
  workflow_dispatch:
    inputs:
      runner:
        description: 'One runner for focused diagnostics; ordinary PRs use the full matrix'
        type: choice
        options: [all, windows-latest, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04]
        default: all
      faults_only:
        description: 'Run only the fault build while diagnosing its own harness'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('native-service-pr-{0}', github.ref) || format('native-service-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  services:
    name: Native services / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: ${{ fromJSON(inputs.runner && inputs.runner != 'all' && format('["{0}"]', inputs.runner) || '["windows-latest","windows-11-arm","ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04"]') }}
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -mod=vendor -p=2
      NETSWITCH_LIFECYCLE_CI: '1'
      NETSWITCH_NATIVE_CI: '1'
      NETSWITCH_LIFECYCLE_FILTER: '^TestNative(ControlCutover|EngineService)$'
      NATIVE_FAULTS_ONLY: ${{ inputs.faults_only && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Offline native contracts, including the full totals measurement
        shell: bash
        run: |
          node .github/ci/registrar-breakaway.mjs
          go test -v -count=1 ./internal/engine ./internal/engine/host ./internal/engine/protocol ./internal/engine/flows ./internal/engine/probe ./internal/engine/testproxy ./internal/service
          go test -v -count=1 -tags lifecycle_test ./internal/engine/testproxy
          go test -tags lifecycle_test -run '^$' -fuzz '^FuzzProxyHandshake$' -fuzztime=5s ./internal/engine/testproxy
          go test -v -count=1 -tags lifecycle_test -run '^TestNative(ReadFault|Readers|ManagerExit|Health)' ./internal/lifecycle
          go test -v -count=1 -run '^TestNative(Stall|TCPInfo|Actor|HeldFlow|LoadFixture)' ./tests/lifecycle
      - name: Windows process diagnostic build contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildCases = @(
              @{ Tags = ''; Tests = @('TestProductNoProcessDiagnostics', 'TestPrivatePipeACLBeforePIDCheck', 'TestAdapterRetirementPrecedesJournalClosure', 'TestAdapterRetirementHonorsCancellation', 'TestAdapterRetirementMayOutliveTwoSeconds', 'TestAdapterPresenceUsesPnPAndBothIPFamilies', 'TestAdapterHistorySurvivesProcessAndJournalCheckpoint', 'TestAdapterCreateAfterRowFullyDisappears', 'TestUnreadableForeignWintunDoesNotBlockPresence', 'TestAdapterIntentRecoversBeforeHistoryWasSaved', 'TestAdapterRecoveryOnlyAdoptsVerifiedIdentity', 'TestCorruptAdapterHistoryIsReplaced', 'TestAdapterHistoryFailureDoesNotAdvanceMemory') },
            @{ Tags = ''; Tests = @('TestAdapterLossContractCleansJournalAndNativeHandleBeforeReceipt', 'TestAdapterLossHandoffIsIdempotentAndLeavesOtherErrorsFatal', 'TestServeTailTerminalDecisionAndLateFailures', 'TestServeTailExplicitStopWinsAndFlushesReplyBeforeClose', 'TestServeTailLeaseCleanupAfterFailedStopWins', 'TestServeTailExplicitStopUnresponsiveControllerIsBounded', 'TestServeTailNoControllerStillReturnsAdapterLoss', 'TestRuntimeStopAfterLossLatchRetriesCancelledCleanup', 'TestServeTailDefersFinalizationUntilTimedOutProbeActuallyJoins') },
            @{ Tags = 'netswitch_handlecheck'; Tests = @('TestUDPPortSpaceDiagnosisReadsHostedSettings', 'TestPortConfigurationMatchesNativeProvider') }
          )
          foreach ($buildCase in $buildCases) {
            $selector = '^(' + ($buildCase.Tests -join '|') + ')$'
            $proof = & go test -v -count=1 -timeout=6m "-tags=$($buildCase.Tags)" "-run=$selector" ./internal/engine/windows
            $result = $LASTEXITCODE
            $proof | Write-Output
            if ($result -ne 0) { exit $result }
            foreach ($test in $buildCase.Tests) {
              if (-not ($proof -match ('^--- PASS: ' + [regex]::Escape($test) + ' '))) {
                throw "Missing PASS for $test with tags '$($buildCase.Tags)'; absent or skipped tests are failures"
              }
            }
          }
      - name: Installed Windows services, product and fault builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -v -count=1 -run '^Test(ProbeUnavailable|RetiredLine|RouteStats|WindowsStatsStayBounded)' ./internal/engine/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($variant in @('product', 'faults')) {
            if ($env:NATIVE_FAULTS_ONLY -eq '1' -and $variant -eq 'product') { continue }
            $env:NETSWITCH_NATIVE_FAULTS = if ($variant -eq 'faults') { '1' } else { '0' }
            $tags = if ($variant -eq 'faults') { 'm4_native,lifecycle_test' } else { 'm4_native' }
            $env:NETSWITCH_LIFECYCLE_DIR = Join-Path $env:ProgramFiles "NetSwitch-Native-CI-$variant"
            foreach ($name in @('netswitch', 'netswitch-engine', 'netswitch-desktop', 'netswitchctl')) {
              go build -tags $tags -ldflags "-X github.com/AyoubAchour/net-switch/internal/buildinfo.Version=${{ github.sha }}-$variant" -o (Join-Path $env:NETSWITCH_LIFECYCLE_DIR "$name.exe") "./cmd/$name"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            go test -c -o (Join-Path $env:NETSWITCH_LIFECYCLE_DIR 'lifecycle.test.exe') ./tests/lifecycle
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            go build -o (Join-Path $env:NETSWITCH_LIFECYCLE_DIR 'testisp.exe') ./tests/windows/testisp
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./tests/windows/testisp/fetch-wintun.ps1 -Directory $env:NETSWITCH_LIFECYCLE_DIR
            icacls $env:NETSWITCH_LIFECYCLE_DIR /setowner '*S-1-5-32-544' /T /Q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Push-Location tests/lifecycle
            try {
              node (Join-Path $env:GITHUB_WORKSPACE 'scripts/run-native-proof.mjs') "native-$variant" (Join-Path $env:NETSWITCH_LIFECYCLE_DIR 'lifecycle.test.exe') run-hosted
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally { Pop-Location }
          }
      - name: Atomic child launch and supervised registrar containment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $PWD 'dist/native-child'
          go build -trimpath -buildvcs=false -o (Join-Path $proof 'netswitch-engine.exe') ./cmd/netswitch-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -tags netswitch_handlecheck -c -o (Join-Path $proof 'winchild.test.exe') ./internal/platform/winchild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -tags netswitch_handlecheck -c -o (Join-Path $proof 'wintun.test.exe') ./internal/wintun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/windows/testisp/fetch-wintun.ps1 -Directory $proof
          $env:NETSWITCH_CHILD_CI = '1'
          $env:NETSWITCH_WINTUN_CI = '1'
          $env:NETSWITCH_WINTUN_PRODUCTION_ENGINE = Join-Path $proof 'netswitch-engine.exe'
          $env:NETSWITCH_WINTUN_PRODUCTION_ENGINE_SHA256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:NETSWITCH_WINTUN_PRODUCTION_ENGINE).Hash.ToLowerInvariant()
          "CONTAINMENT_BINARY $env:NETSWITCH_WINTUN_PRODUCTION_ENGINE $env:NETSWITCH_WINTUN_PRODUCTION_ENGINE_SHA256"
          node scripts/run-native-proof.mjs launch (Join-Path $proof 'winchild.test.exe') '-test.v' '-test.timeout=2m'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/run-native-proof.mjs containment-retry (Join-Path $proof 'wintun.test.exe') '-test.v' '-test.timeout=5m' '-test.run=^Test(WintunSupervisorContainment|RegistrarBusyRetryOnlyUnclaimedRegistration)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installed Linux services, product and fault builds
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -v -count=1 -run '^Test(LineSlot|ProbeUnavailable|DeprecatedAddresses)' ./internal/engine/linux
          for variant in product faults; do
            if [ "$NATIVE_FAULTS_ONLY" = 1 ] && [ "$variant" = product ]; then continue; fi
            export NETSWITCH_NATIVE_FAULTS=0
            tags=m4_native
            if [ "$variant" = faults ]; then export NETSWITCH_NATIVE_FAULTS=1; tags=m4_native,lifecycle_test; fi
            export NETSWITCH_LIFECYCLE_DIR="/usr/lib/netswitch-native-ci-$variant"
            sudo install -d -o "$(id -u)" -g "$(id -g)" "$NETSWITCH_LIFECYCLE_DIR"
            for name in netswitch netswitch-engine netswitch-desktop netswitchctl; do
              go build -tags "$tags" -ldflags "-X github.com/AyoubAchour/net-switch/internal/buildinfo.Version=${{ github.sha }}-$variant" -o "$NETSWITCH_LIFECYCLE_DIR/$name" "./cmd/$name"
            done
            go test -c -o "$NETSWITCH_LIFECYCLE_DIR/lifecycle.test" ./tests/lifecycle
            sudo chown -R root:root "$NETSWITCH_LIFECYCLE_DIR"
            (cd tests/lifecycle && sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,NETSWITCH_LIFECYCLE_CI,NETSWITCH_LIFECYCLE_DIR,NETSWITCH_NATIVE_CI,NETSWITCH_NATIVE_FAULTS "$(command -v node)" "$GITHUB_WORKSPACE/scripts/run-native-proof.mjs" "native-$variant" "$NETSWITCH_LIFECYCLE_DIR/lifecycle.test" -test.v '-test.run=^TestNative(ControlCutover|EngineService)$' -test.timeout=20m)
          done
      - name: Linux service evidence
        if: always() && runner.os == 'Linux'
        shell: bash
        run: sudo journalctl -u netswitch-engine.service -u netswitch.service --no-pager --lines=200
      - name: Windows service evidence
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-WinEvent -LogName Application -FilterXPath "*[System[Provider[@Name='NetSwitch'] or Provider[@Name='NetSwitchEngine']]]" -MaxEvents 40 -ErrorAction SilentlyContinue | ForEach-Object { $_.ToXml() }
          if (Test-Path (Join-Path $env:ProgramData 'netswitch-lifecycle-test.log')) { Get-Content (Join-Path $env:ProgramData 'netswitch-lifecycle-test.log') }
          exit 0

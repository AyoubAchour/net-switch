name: TIME_WAIT investigation

on:
  push:
    branches: [engine/timewait-flaky-rst]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    name: Repeat / ${{ matrix.runner }} / race=${{ matrix.race }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm]
        race: [false, true]
        exclude:
          # Go does not support -race on windows/arm64.
          - runner: windows-11-arm
            race: true
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -mod=vendor -p=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read pinned Go
        id: pins
        shell: pwsh
        run: |
          $pins = Get-Content packaging/versions.json -Raw | ConvertFrom-Json
          "go_version=$($pins.go.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ steps.pins.outputs.go_version }}
          cache: false
      - name: Repeat the reported failure 5000 times
        run: go test ${{ matrix.race && '-race' || '' }} -v -count=5000 -timeout=30m -run '^TestTimeWaitBlockedAndBudgetReuse$' ./internal/engine/stack/...
      - name: Repeat the other short TIME_WAIT cases 5000 times
        if: ${{ !cancelled() }}
        run: go test ${{ matrix.race && '-race' || '' }} -v -short -count=5000 -timeout=30m -run 'TestTimeWait' -skip 'BlockedAndBudgetReuse|ImmediateReuse|ReuseDelays|SequenceWrap|SmallCapSkipsWithoutRejecting' ./internal/engine/stack/...

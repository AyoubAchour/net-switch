name: Windows handle diagnostics

on:
  push:
    branches: [engine/windows-platform-handles]
  workflow_dispatch:
    inputs:
      arch:
        description: Native Windows architecture
        type: choice
        options: [x64, ARM64]
        default: x64

permissions:
  contents: read

jobs:
  handles:
    name: Native handle diagnostics / ${{ inputs.arch || 'x64' }}
    runs-on: ${{ inputs.arch == 'ARM64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -mod=vendor -p=2 -tags=netswitch_handlecheck
      NETSWITCH_EXPECT_HANDLECHECK: '1'
      NETSWITCH_ENGINE_TEST_TRACE: '1'
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prove native poll lifetime and callback collection
        run: |
          go test -count=1 -v -timeout=2m -run '^Test(TCPWritePoll|OldUnlockedPoll)' ./internal/engine/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the same ownership boundaries under race
        if: ${{ !cancelled() && inputs.arch != 'ARM64' }}
        run: |
          go test -race -count=1 -v -timeout=2m -run '^Test(TCPWritePoll|OldUnlockedPoll)' ./internal/engine/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check shared UDP destroy and setup-refusal accounting
        if: ${{ !cancelled() }}
        run: |
          go test -count=1 -v -run '^Test(DestroyFinishesAcrossFailedSetupCachePublication|FailedUDPSetupRetiresBeforeRefusalAndBoundsNegativeCache)$' ./internal/engine/udp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ inputs.arch }}' -ne 'ARM64') {
            go test -race -count=1 -v -run '^Test(DestroyFinishesAcrossFailedSetupCachePublication|FailedUDPSetupRetiresBeforeRefusalAndBoundsNegativeCache)$' ./internal/engine/udp
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

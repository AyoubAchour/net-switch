name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Windows ${{ matrix.arch }} / engine configs and TUN
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the exact bundled Node version
        id: node
        run: |
          $pins = Get-Content packaging/versions.json -Raw | ConvertFrom-Json
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$($pins.node.version)`n")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Unit tests on the exact bundled Node
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch the verified engine
        run: ./scripts/fetch-engine.ps1
      - name: Check generated configs, deprecations and build tags
        run: |
          node scripts/check-engine-config.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test real TUN routing and report port reuse and DNS changes
        run: |
          node scripts/e2e-tun.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep TUN logs and probe results, including on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tun-test-${{ matrix.arch }}
          path: |
            dist/tun-test/*.log*
            dist/tun-test/report.txt
          retention-days: 14

  # Net Switch 1.0, in progress: the Go code in the root module (cmd/, internal/).
  # Nothing here ships until 1.0; 0.3.x keeps building from the jobs below.
  go1:
    name: Go 1.0 / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
          - name: Windows ARM64
            runner: windows-11-arm
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -mod=readonly -p=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned Go version
        id: pins
        shell: pwsh
        run: |
          $pins = Get-Content packaging/versions.json -Raw | ConvertFrom-Json
          "go_version=$($pins.go.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.pins.outputs.go_version }}
          cache: false
      # The 1.0 trees by name: "./..." from the root would also walk dist/, where
      # the build scripts keep a whole Go toolchain.
      - run: go vet ./internal/... ./cmd/... ./tests/...
      - run: go test ./internal/... ./cmd/... ./tests/...
      - run: go build ./internal/... ./cmd/... ./tests/...
      - name: Race checks for the control packages
        if: runner.os == 'Linux' || matrix.name == 'Windows x64'
        run: go test -race ./internal/... ./tests/...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compare random inputs against the Node oracle
        if: runner.os == 'Linux'
        run: |
          go build -o ./bin/differential ./tests/differential/runner
          node tests/differential/run.mjs ./bin/differential

  linux:
    name: Linux / Node ${{ matrix.node }} (shared code)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test

  linux-helper:
    name: Linux / helper build and shared tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: helper
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -mod=readonly -p=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned Go version
        id: pins
        run: echo "go_version=$(jq -r .go.version ../packaging/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.pins.outputs.go_version }}
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  test:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        # The app and C# tray tests must work under Windows PowerShell 5.1.
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Build and test the native helper with the pinned Go
        run: ./scripts/build-helper.ps1
      - name: Build the tray program with the C# compiler that comes with Windows
        run: ./scripts/build-tray.ps1
      - name: Test app, tray program and C# tray with Windows PowerShell 5.1
        run: npm test
      - name: Route real connections through the engine, per app and combined
        run: |
          ./scripts/fetch-engine.ps1
          node scripts/e2e-routing.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify pinned downloads and stage the installer payload
        run: ./scripts/build-release.ps1 -SkipInstaller

  installer:
    name: Installer smoke test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the installer
        run: ./scripts/build-release.ps1
      - name: Install, upgrade and uninstall it
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/smoke-test-installer.ps1 -Installer "dist/NetSwitch-Setup-$version-x64.exe"

  arm64:
    name: Windows ARM64 / tests and installer
    runs-on: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: arm64
          package-manager-cache: false
      - name: Confirm native Node and build and test the helper
        run: |
          node -e "if (process.arch !== 'arm64') process.exit(1)"
          ./scripts/build-helper.ps1 -Arch arm64
      - name: Build the AnyCPU tray
        run: ./scripts/build-tray.ps1
      - name: Test app, native helper and tray on ARM64
        run: npm test
      - name: Route real connections through the ARM64 engine, per app and combined
        if: ${{ !cancelled() }}
        run: |
          ./scripts/fetch-engine.ps1
          node scripts/e2e-routing.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source provenance for both engine architectures
        if: ${{ !cancelled() }}
        run: node scripts/write-source-manifest.mjs --verify-only
      - name: Build the ARM64 installer and verify its payload
        if: ${{ !cancelled() }}
        id: arm64-build
        run: ./scripts/build-release.ps1 -Arch arm64
      - name: Install, upgrade and uninstall it
        if: ${{ !cancelled() && steps.arm64-build.outcome == 'success' }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/smoke-test-installer.ps1 -Installer "dist/NetSwitch-Setup-$version-arm64.exe" -Arch arm64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false
      - name: Verify registry detection and updates under x64 emulation
        env:
          NETSWITCH_TEST_X64_ON_ARM64: '1'
        run: |
          node --test test/architecture.test.mjs test/updates.test.mjs test/engine.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . ./scripts/build-common.ps1
          if ((Get-NativeArchitecture) -ne 'arm64') { throw 'Source engine download would use the wrong architecture.' }

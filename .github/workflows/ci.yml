name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        # The app and C# tray tests must work under Windows PowerShell 5.1.
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Build and test the native helper with the pinned Go
        run: ./scripts/build-helper.ps1
      - name: Diagnose adapter visibility on the runner
        run: |
          Get-NetAdapter -IncludeHidden | Format-List *
          Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e972-e325-11ce-bfc1-08002be10318}' -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath } | Select-Object NetCfgInstanceId, DriverDesc, Characteristics | Format-List
          Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Control\Network\{4d36e972-e325-11ce-bfc1-08002be10318}' -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty ($_.PSPath + '\Connection') -ErrorAction SilentlyContinue } | Format-List *
          Get-PnpDevice -Class Net | Format-List Status, Class, FriendlyName, InstanceId, Present
          ./helper/bin/netswitch-helper.exe network --once
      - name: Build the tray program with the C# compiler that comes with Windows
        run: ./scripts/build-tray.ps1
      - name: Test app, tray program and C# tray with Windows PowerShell 5.1
        run: npm test
      - name: Verify pinned downloads and stage the installer payload
        run: ./scripts/build-release.ps1 -SkipInstaller

  installer:
    name: Installer smoke test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the installer
        run: ./scripts/build-release.ps1
      - name: Install, upgrade and uninstall it
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/smoke-test-installer.ps1 -Installer "dist/NetSwitch-Setup-$version-x64.exe"

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Windows ${{ matrix.arch }} / engine configs and TUN
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the exact bundled Node version
        id: node
        run: |
          $pins = Get-Content packaging/versions.json -Raw | ConvertFrom-Json
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$($pins.node.version)`n")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Unit tests on the exact bundled Node
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch the verified engine
        run: ./scripts/fetch-engine.ps1
      - name: Check generated configs, deprecations and build tags
        run: |
          node scripts/check-engine-config.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test real TUN routing and report port reuse and DNS changes
        run: |
          node scripts/e2e-tun.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep TUN logs and probe results, including on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tun-test-${{ matrix.arch }}
          path: |
            dist/tun-test/*.log*
            dist/tun-test/report.txt
          retention-days: 14

  # Net Switch 1.0, in progress: the Go code in the root module (cmd/, internal/).
  # Nothing here ships until 1.0; 0.3.x keeps building from the jobs below.
  go1:
    name: Go 1.0 / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
          - name: Windows ARM64
            runner: windows-11-arm
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -mod=vendor -p=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned Go version
        id: pins
        shell: pwsh
        run: |
          $pins = Get-Content packaging/versions.json -Raw | ConvertFrom-Json
          "go_version=$($pins.go.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.pins.outputs.go_version }}
          cache: false
      # The 1.0 trees by name: "./..." from the root would also walk dist/, where
      # the build scripts keep a whole Go toolchain.
      - name: Verify and regenerate patched dependencies byte for byte
        shell: pwsh
        run: |
          node scripts/generate-gvisor.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod vendor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- third_party/gvisor vendor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $untracked = git ls-files --others --exclude-standard -- third_party/gvisor vendor
          if ($untracked) { throw "Untracked generated dependencies: $untracked" }
      - run: go vet ./internal/... ./cmd/... ./tests/...
      - run: go test -v ./internal/... ./cmd/... ./tests/...
      - run: go build ./internal/... ./cmd/... ./tests/...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compare random inputs against the Node oracle
        if: runner.os == 'Linux'
        run: |
          go build -o ./bin/differential ./tests/differential/runner
          node tests/differential/run.mjs ./bin/differential
      - name: Race detector
        if: matrix.name == 'Linux x64' || matrix.name == 'Linux ARM64' || matrix.name == 'Windows x64'
        run: go test -race -v ./internal/... ./cmd/... ./tests/...
      - name: Record the complete TIME_WAIT acceptance gate under race detection
        if: matrix.name != 'Windows ARM64'
        run: go test -race -v -count=1 -run 'TimeWait|PacketOrderPerTuple' ./internal/engine/stack
      # Sustained default-limit load and full heap sampling run once, separately
      # from the race suite so timing and memory measurements stay meaningful.
      - name: Sustain 1000 successful connections per second at default limits
        env:
          NETSWITCH_TIMEWAIT_GATE: '1'
        run: go test -v -count=1 -run '^TestTimeWait(ThousandPerSecondSuccess|SameTupleUnderLoad)$' ./internal/engine/stack
      - name: Measure retained TIME_WAIT memory after payload buffers drain
        env:
          NETSWITCH_TIMEWAIT_PROFILE: timewait.pprof
        run: go test -v -count=1 -memprofilerate=1 -run '^TestTimeWaitEndpointMemory$' ./internal/engine/stack
      - name: Keep the TIME_WAIT heap profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timewait-heap-${{ matrix.name }}
          path: internal/engine/stack/timewait.pprof
          if-no-files-found: error
          retention-days: 14
      - name: Repeat clock and reopen boundaries 1000 times
        run: go test ${{ matrix.name != 'Windows ARM64' && '-race' || '' }} -v -count=1000 -run '^TestTimeWait(LostFinalACK|SYNBetweenRemovalAndHook|LateHookDoesNotReadmitLiveFlow|ClosingQueue|SYNBeforeCloseState|SYNBeforeRemoval|ZeroCapClosingBatch)$' ./internal/engine/stack
      - name: Repeat endpoint setup deduplication and cancellation 1000 times
        run: go test ${{ matrix.name != 'Windows ARM64' && '-race' || '' }} -v -count=1000 -run '^Test(ReopenHookDuringEndpointSetupDeduplicates|CancelDuringEndpointSetup)$' ./internal/engine/tcp
      - name: Fuzz unprivileged packet and protocol paths
        if: matrix.name == 'Linux x64'
        run: |
          go test -run '^$' -fuzz '^FuzzPackets$' -fuzztime 30s -parallel 2 ./internal/engine/packet
          go test -run '^$' -fuzz '^FuzzUDPHandler$' -fuzztime 30s -parallel 2 ./internal/engine/udp
          go test -run '^$' -fuzz '^FuzzProtocol$' -fuzztime 30s -parallel 2 ./internal/engine/protocol

  wintun:
    name: Wintun session / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: -mod=vendor -p=2
      NETSWITCH_WINTUN_CI: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned Go version
        id: pins
        run: |
          $pins = Get-Content packaging/versions.json -Raw | ConvertFrom-Json
          "go_version=$($pins.go.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.pins.outputs.go_version }}
          cache: false
      - name: Compile the native test executable
        run: go test -c -o ./bin/wintun.test.exe ./internal/wintun
      - name: Fetch the unchanged signed Wintun DLL beside the executable
        run: ./scripts/prepare-wintun-tests.ps1
      - name: Ring ABI, parser, cancellation, corruption recovery and parallel UDP
        run: ./bin/wintun.test.exe '-test.v' '-test.timeout=8m' '-test.run=TestRing|TestPinnedDLL|TestWintun(ParallelUDP|RecoveryAndCancellation|AdapterRemoval)$'
      - name: Single-packet ping-pong, 200000 round trips per implementation
        if: ${{ !cancelled() }}
        run: ./bin/wintun.test.exe '-test.v' '-test.timeout=10m' '-test.run=^TestWintunPingPong$'
      - name: Bulk UDP and TCP throughput and latency comparison
        if: ${{ !cancelled() }}
        run: ./bin/wintun.test.exe '-test.v' '-test.timeout=10m' '-test.run=^TestWintunPerformance$'
      - name: 1000 session cycles and forced crash cleanup, including phantom devices
        if: ${{ !cancelled() }}
        run: ./bin/wintun.test.exe '-test.v' '-test.timeout=5m' '-test.run=^TestWintun(Lifetime|Crash)$'
      - name: Fuzz the ring-entry parser
        if: ${{ !cancelled() }}
        env:
          NETSWITCH_WINTUN_CI: '0'
        run: go test -run '^$' -fuzz '^FuzzRingEntry$' -fuzztime 30s -parallel 2 ./internal/wintun
      - name: Race detector with real recovery and teardown
        if: ${{ !cancelled() && matrix.arch == 'x64' }}
        run: |
          go test -race -c -o ./bin/wintun-race.test.exe ./internal/wintun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./bin/wintun-race.test.exe '-test.v' '-test.timeout=5m' '-test.run=TestRing|TestWintun(RecoveryAndCancellation|AdapterRemoval|Lifetime)$'

  linux:
    name: Linux / Node ${{ matrix.node }} (shared code)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test

  linux-helper:
    name: Linux / helper build and shared tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: helper
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -mod=readonly -p=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned Go version
        id: pins
        run: echo "go_version=$(jq -r .go.version ../packaging/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.pins.outputs.go_version }}
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  test:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        # The app and C# tray tests must work under Windows PowerShell 5.1.
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Build and test the native helper with the pinned Go
        run: ./scripts/build-helper.ps1
      - name: Build the tray program with the C# compiler that comes with Windows
        run: ./scripts/build-tray.ps1
      - name: Test app, tray program and C# tray with Windows PowerShell 5.1
        run: npm test
      - name: Route real connections through the engine, per app and combined
        run: |
          ./scripts/fetch-engine.ps1
          node scripts/e2e-routing.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify pinned downloads and stage the installer payload
        run: ./scripts/build-release.ps1 -SkipInstaller

  installer:
    name: Installer smoke test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the installer
        run: ./scripts/build-release.ps1
      - name: Install, upgrade and uninstall it
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/smoke-test-installer.ps1 -Installer "dist/NetSwitch-Setup-$version-x64.exe"

  arm64:
    name: Windows ARM64 / tests and installer
    runs-on: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: arm64
          package-manager-cache: false
      - name: Confirm native Node and build and test the helper
        run: |
          node -e "if (process.arch !== 'arm64') process.exit(1)"
          ./scripts/build-helper.ps1 -Arch arm64
      - name: Build the AnyCPU tray
        run: ./scripts/build-tray.ps1
      - name: Test app, native helper and tray on ARM64
        run: npm test
      - name: Route real connections through the ARM64 engine, per app and combined
        if: ${{ !cancelled() }}
        run: |
          ./scripts/fetch-engine.ps1
          node scripts/e2e-routing.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source provenance for both engine architectures
        if: ${{ !cancelled() }}
        run: node scripts/write-source-manifest.mjs --verify-only
      - name: Build the ARM64 installer and verify its payload
        if: ${{ !cancelled() }}
        id: arm64-build
        run: ./scripts/build-release.ps1 -Arch arm64
      - name: Install, upgrade and uninstall it
        if: ${{ !cancelled() && steps.arm64-build.outcome == 'success' }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/smoke-test-installer.ps1 -Installer "dist/NetSwitch-Setup-$version-arm64.exe" -Arch arm64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false
      - name: Verify registry detection and updates under x64 emulation
        env:
          NETSWITCH_TEST_X64_ON_ARM64: '1'
        run: |
          node --test test/architecture.test.mjs test/updates.test.mjs test/engine.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . ./scripts/build-common.ps1
          if ((Get-NativeArchitecture) -ne 'arm64') { throw 'Source engine download would use the wrong architecture.' }

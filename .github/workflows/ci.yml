  wintun-boundaries:
    if: github.event_name == 'workflow_dispatch' && inputs.wintun_integrity && (inputs.wintun_integrity_scenario == 'boundaries' || inputs.wintun_integrity_scenario == 'boundaries-hunt')
    name: Word boundaries / ${{ matrix.runner }} / ${{ matrix.replica }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        runner: [windows-latest, windows-11-arm]
        replica: ${{ fromJSON(inputs.wintun_integrity_scenario == 'boundaries-hunt' && inputs.wintun_boundary_shards == '5' && '[1,2,3,4,5]' || inputs.wintun_integrity_scenario == 'boundaries-hunt' && inputs.wintun_boundary_shards == '2' && '[1,2]' || '[1]') }}
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: -mod=vendor -p=2
      NETSWITCH_WINTUN_CI: '1'
      NETSWITCH_WINTUN_INTEGRITY: '0'
      NETSWITCH_BOUNDARY_BASELINE: bin/wintun-baseline.test.exe
      NETSWITCH_BOUNDARY_DIAGNOSTIC: bin/wintun-boundaries.test.exe
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Check dispatch caps and release guards
        run: node --test .github/ci/wintun-boundaries.test.mjs .github/ci/wintun-release.test.mjs .github/ci/gates.test.mjs
      - name: Build release registrar and both test variants
        run: |
          go build -trimpath -buildvcs=false -ldflags '-s -w -buildid=' -o dist/registrar-release/netswitch-engine.exe ./cmd/netswitch-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -buildvcs=false -o dist/registrar-release/netswitch-engine-audit.exe ./cmd/netswitch-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o ./bin/wintun-baseline.test.exe ./internal/wintun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -tags=wintun_boundaries -c -o ./bin/wintun-boundaries.test.exe ./internal/wintun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-wintun-release.mjs dist/registrar-release/netswitch-engine.exe dist/registrar-release/netswitch-engine-audit.exe bin/wintun-boundaries.test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $engine = (Resolve-Path dist/registrar-release/netswitch-engine.exe).Path
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $engine).Hash.ToLowerInvariant()
          "NETSWITCH_WINTUN_PRODUCTION_ENGINE=$engine" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NETSWITCH_WINTUN_PRODUCTION_ENGINE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: ./.github/actions/cache-pinned-archive
        with:
          artifact: wintun
      - name: Prepare signed Wintun DLL
        run: ./scripts/prepare-wintun-tests.ps1
      - name: Boundary mapping and injected evidence regressions
        run: ./bin/wintun-boundaries.test.exe '-test.v' '-test.run=^TestWordBoundary|^TestPayloadWords' '-test.timeout=2m'
      - name: Untagged versus tagged overhead pilot
        if: inputs.wintun_integrity_scenario == 'boundaries'
        run: ./bin/wintun-baseline.test.exe '-test.v' '-test.run=^TestWintunBoundaryProof$' '-test.timeout=20m'
      - name: Explicitly selected boundary hunt
        if: inputs.wintun_integrity_scenario == 'boundaries-hunt'
        env:
          NETSWITCH_WINTUN_BOUNDARIES: '1'
        run: |
          foreach ($reference in @('dll', 'inprocess')) {
            $env:NETSWITCH_WINTUN_REFERENCE = $reference
            ./bin/wintun-boundaries.test.exe '-test.v' '-test.run=^TestWintunPerformance$' '-test.count=2' '-test.timeout=12m'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  wintun-payload-pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.wintun_integrity && inputs.wintun_integrity_scenario == 'payload'

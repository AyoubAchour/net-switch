name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        # The app and C# tray tests must work under Windows PowerShell 5.1.
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Build and test the native helper with the pinned Go
        run: ./scripts/build-helper.ps1
      - name: Test app and compile C# tray with Windows PowerShell 5.1
        run: npm test
      - name: Verify pinned downloads and stage the installer payload
        run: ./scripts/build-release.ps1 -SkipInstaller

  installer:
    name: Installer smoke test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the installer
        run: ./scripts/build-release.ps1
      - name: Install, upgrade and uninstall it
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/smoke-test-installer.ps1 -Installer "dist/NetSwitch-Setup-$version-x64.exe"
